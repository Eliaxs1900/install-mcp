[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watcher-mcp"
version = "0.3.1"
description = "Servidor MCP que lanza y vigila trabajos largos (instalaciones, descargas, clones, builds y tests) en segundo plano: logs en vivo, aviso de atasco, esperas acotadas e informe al terminar."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elías Martín" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude", "watchdog", "background-jobs", "installer", "build", "pip", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "trustme>=1.1"]
# Solo para regenerar los GIF/PNG de docs/demos (scripts/render_cast.py).
demo = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/Eliaxs1900/watcher-mcp"
Issues = "https://github.com/Eliaxs1900/watcher-mcp/issues"

[project.scripts]
watcher-mcp = "watcher_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: de punta a punta con herramientas o servicios reales (pip/uv, git, HTTPS local, cliente MCP, red); las puntuales son el resto",
    "integration: lanza instaladores reales en modo offline",
    "network: necesita red e instala de verdad (solo con WATCHER_MCP_NETWORK_TESTS=1, pensado para Docker)",
]
filterwarnings = ["ignore::mcp.shared.exceptions.MCPDeprecationWarning"]

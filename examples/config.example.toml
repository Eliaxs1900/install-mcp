# Copia a ~/.config/watcher-mcp/config.toml o pásalo con --config / $WATCHER_MCP_CONFIG.

# Jobs, logs y venvs con nombre.
# state_dir = "~/.local/state/watcher-mcp"

# Solo estos backends se pueden usar. Por defecto, todos menos apt (root) y run.
allowed_backends = ["pip", "git", "download", "binary", "npm", "cargo", "go", "maven", "gradle", "brew", "docker"]

# Backends que necesitan root (apt-get...) se rechazan salvo que esto sea true.
allow_privileged = false
# Prefijo para pasos privilegiados; -n = nunca pedir contraseña (falla en vez de colgarse).
privilege_command = ["sudo", "-n"]

max_parallel = 4
default_job_timeout_s = 3600      # al vencer: SIGTERM, SIGKILL, estado timed_out
default_stall_timeout_s = 300     # sin salida N s -> stalled + aviso (0 = desactivado)
max_queue_s = 3600                # máximo en cola
default_wait_s = 60               # wait() sin timeout
listener_timeout_s = 5
default_io_mode = "pipe"          # pipe | pty | stdbuf
max_wait_s = 300                  # tope duro de wait()
memory_log_lines = 5000
max_jobs_kept = 200

# Dónde pueden escribir los backends (venvs por ruta, clones, descargas) y leer ficheros pedidos
# (requirements, repos locales).
allowed_roots = ["~"]
# Zonas protegidas DENTRO de las raíces: rutas con algún componente oculto (~/.zshrc, ~/.ssh,
# proyecto/.git/hooks...) y estos directorios de primer nivel de HOME. Para usar una a propósito,
# añádela como raíz explícita, p. ej. allowed_roots = ["~", "~/.local/bin"].
protect_dot_paths = true
protected_home_dirs = ["Library"]

# Tope duro de cualquier job, aunque se pida "sin límite" (job_timeout_s = 0).
max_job_timeout_s = 86400
# Al cancelar un paso interno (descarga en un hilo): espera a que suelte su hilo antes de liberar el lock.
func_cancel_grace_s = 75

# Regex extra a redactar en los logs.
redact_patterns = []

# Backends externos: "paquete.modulo:Clase" (además hay que añadirlos a allowed_backends).
plugins = []

[backends.pip]
prefer_uv = true
# Límites propios del backend (la petición puede sobrescribirlos):
# job_timeout_s = 1800
# stall_timeout_s = 600
# io_mode = "pipe"
# uv_path = "/opt/homebrew/bin/uv"
# base_python = "/usr/bin/python3"   # para python -m venv cuando no hay uv

[backends.download]
# ca_bundle = "/ruta/ca.pem"        # CA propia (proxy corporativo)
# max_bytes = 5368709120            # 5 GiB
# read_timeout_s = 60
# max_extract_bytes = 21474836480   # 20 GiB: tope de lo extraído (bombas de descompresión)
# max_extract_files = 100000

[backends.binary]
# bin_dir = "~/.local/bin"          # por defecto <state_dir>/bin; ~/.local es zona protegida:
#                                     añade "~/.local/bin" a allowed_roots para usarla

[backends.run]
# Programas que `run` puede ejecutar (además hay que añadir "run" a allowed_backends).
# programs = ["mvn", "pytest", "make"]
# Variables de entorno que puede pasar la petición, además de las básicas (CI, LANG, TZ, NO_COLOR...).
# Nunca se aceptan PATH, LD_*, DYLD_*... (inyectarían código en los programas permitidos).
# env_allow = ["MI_VARIABLE"]

# [backends.apt]                    # requiere allow_privileged = true y "apt" en allowed_backends
# stall_timeout_s = 600

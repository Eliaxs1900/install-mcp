name: tests

on:
  push:
    branches: [main]
  pull_request:

# Pruebas selectivas: en un PR solo se ejecuta lo que toca el cambio (scripts/select_tests.py);
# en main, siempre todo como red de seguridad. Dos niveles:
# - puntuales: validación, planes y núcleo con backends falsos (rápidas) -> matriz completa;
# - e2e (marcador e2e): pip/uv, git, HTTPS local, cliente MCP -> en PR, un Python por SO.

# Pruebas verificadas en local: si un MANTENEDOR ejecutó la suite completa en su máquina
# (scripts/verificar_local.py) y publicó el status "tests-locales" sobre la cabeza del PR, con el
# árbol que GitHub iba a probar, ``select`` omite las pruebas (puntuales=NONE, e2e=NONE). Solo cuenta
# un status puesto por alguien con rol admin/maintain; una etiqueta o un trailer no. En un PR se ejecuta
# la versión de scripts/ci_local.py de la BASE, no la del PR. Ver scripts/ci_local.py.

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      puntuales: ${{ steps.sel.outputs.puntuales }}
      e2e: ${{ steps.sel.outputs.e2e }}
      local: ${{ steps.local.outputs.local }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: local
        name: Comprobar si un mantenedor ya verificó este árbol en local
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          TREE=$(git rev-parse 'HEAD^{tree}')
          if [ "$EVENT" = "pull_request" ]; then
            # Las reglas son las de la base: el PR no puede cambiar con qué se juzga a sí mismo.
            if ! git show "$BASE_SHA:scripts/ci_local.py" > "$RUNNER_TEMP/ci_local.py" 2>/dev/null; then
              echo "local=CI completa: scripts/ci_local.py no existe aún en la base" >> "$GITHUB_OUTPUT"; exit 0
            fi
            python3 "$RUNNER_TEMP/ci_local.py" decide --event pull_request --repo "$REPO" --sha "$HEAD_SHA" --tree "$TREE" --same-repo "$SAME_REPO" || echo "local=CI completa: falló la comprobación" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_local.py decide --event push --repo "$REPO" --sha "$GITHUB_SHA" --tree "$TREE" || echo "local=CI completa: falló la comprobación" >> "$GITHUB_OUTPUT"
          fi
      - id: sel
        name: Elegir pruebas
        env:
          SKIP: ${{ steps.local.outputs.skip }}
          LOCAL: ${{ steps.local.outputs.local }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Pruebas omitidas: $LOCAL"
            printf 'puntuales=NONE\ne2e=NONE\n' | tee -a "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/select_tests.py --tiers --base "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'puntuales=ALL\ne2e=ALL\n' | tee -a "$GITHUB_OUTPUT"
          fi

  puntuales:
    needs: select
    if: needs.select.outputs.puntuales != 'NONE'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Pruebas puntuales (${{ needs.select.outputs.puntuales }})
        env:
          TESTS: ${{ needs.select.outputs.puntuales }}
        run: |
          if [ "$TESTS" = "ALL" ]; then set --; else set -- $TESTS; fi
          .venv/bin/python -m pytest -q -m "not e2e" "$@"

  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'NONE'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ${{ github.event_name == 'push' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON('["3.12"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Pruebas E2E, incluye instalaciones reales offline con pip y uv (${{ needs.select.outputs.e2e }})
        env:
          TESTS: ${{ needs.select.outputs.e2e }}
        run: |
          if [ "$TESTS" = "ALL" ]; then set --; else set -- $TESTS; fi
          .venv/bin/python -m pytest -q -m "e2e" "$@"

  # Check único y estable para la protección de rama: los nombres de la matriz cambian y,
  # cuando la selección omite un nivel, sus checks ni existen. Pasa si todo lo que se
  # ejecutó pasó (un nivel omitido cuenta como bien) y falla si algo falló o se canceló.
  resultado:
    if: always()
    needs: [select, puntuales, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar resultados
        env:
          LOCAL: ${{ needs.select.outputs.local }}
        run: |
          echo "select=${{ needs.select.result }} puntuales=${{ needs.puntuales.result }} e2e=${{ needs.e2e.result }}"
          echo "origen del verde: ${LOCAL:-pruebas ejecutadas por la CI}"
          [ "${{ needs.select.result }}" = "success" ] || { echo "falló la selección"; exit 1; }
          for r in "${{ needs.puntuales.result }}" "${{ needs.e2e.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "falló un nivel de pruebas: $r"; exit 1 ;;
            esac
          done
